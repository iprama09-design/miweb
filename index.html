<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Prama | Elite Fortnite Coaching</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030508;
            --bg-card: rgba(12, 17, 29, 0.85);
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(138, 43, 226, 0.08) 0%, transparent 40%);
            overflow-x: hidden;
        }

        /* BARRA DE NAVEGACIÓN Y MENÚ DESPLEGABLE */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(3, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            text-decoration: none;
        }

        /* Menú de 3 líneas (Hamburguesa) */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            cursor: pointer;
            z-index: 1002;
        }

        .menu-toggle span {
            display: block;
            height: 3px;
            width: 100%;
            background: var(--text-main);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        /* Panel Desplegable */
        .dropdown-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(8, 12, 20, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
            padding: 90px 30px 40px;
            transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1001;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }

        .dropdown-menu.active {
            right: 0;
        }

        .dropdown-menu a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: color 0.2s;
        }

        .dropdown-menu a:hover {
            color: var(--accent-cyan);
            padding-left: 5px;
        }

        /* CABECERA PRINCIPAL */
        header {
            text-align: center;
            padding: 70px 20px 40px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.08);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* CONTENEDOR Y TARJETAS DE PRECIOS */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 20px 80px;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            position: relative;
            transition: all 0.35s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 240, 255, 0.35);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 240, 255, 0.12);
        }
