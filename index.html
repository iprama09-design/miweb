    <style>
        :root {
            --bg-main: #060608;
            --bg-elevated: #0d0e12;
            --bg-card: #12141a;
            --border-subtle: #1f222c;
            --border-strong: #2e3342;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-red: #ff3b4e;
            --accent-red-hover: #e02d3f;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        html, body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Grid sutil de telemetría en el fondo */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* NAVBAR */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(6, 6, 8, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 0;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(255, 59, 78, 0.14);
            color: var(--accent-red);
            border: 1px solid rgba(255, 59, 78, 0.35);
            padding: 2px 8px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav-cta {
            background: var(--text-primary);
            color: var(--bg-main);
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: transform 0.15s ease, opacity 0.2s;
        }

        .btn-nav-cta:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .menu-trigger {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: border-color 0.2s, background 0.2s;
        }

        .menu-trigger:hover {
            border-color: var(--accent-red);
            background: #181b24;
        }

        .drawer-overlay {

            inset: 0;
