<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Prama | Elite Fortnite Coaching</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0f1d;
            --bg-card: #131b2e;
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* BARRA DE NAVEGACIÓN SUPERIOR */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #070a14;
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent-cyan);
            text-decoration: none;
            letter-spacing: 1px;
        }

        /* BOTÓN DE 3 LÍNEAS (HAMBURGUESA) */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 32px;
            height: 24px;
            cursor: pointer;
            z-index: 1002;
        }

        .menu-toggle span {
            display: block;
            height: 4px;
            width: 100%;
            background: var(--accent-cyan);
            border-radius: 4px;
            box-shadow: 0 0 8px var(--accent-cyan);
            transition: all 0.3s ease;
        }

        /* PANEL DESPLEGABLE LATERAL */
        .dropdown-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100vh;
            background: #0d1322;
            border-left: 2px solid var(--accent-cyan);
            display: flex;
            flex-direction: column;
            padding: 90px 30px 40px;
            transition: right 0.4s ease;
            z-index: 1001;
            box-shadow: -15px 0 40px rgba(0, 0, 0, 0.9);
        }

        .dropdown-menu.active {
            right: 0;
        }

        .dropdown-menu a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: color 0.2s;
        }

        .dropdown-menu a:hover {
            color: var(--accent-cyan);
            padding-left: 8px;
        }

        /* CABECERA */
        header {
            text-align: center;
            padding: 80px 20px 40px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.12);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
