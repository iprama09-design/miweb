<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Prama | Elite Fortnite Coaching</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #05070d;
            --bg-card: #0d1322;
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* NAVEGACIÓN Y MENÚ DE 3 LÍNEAS */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #020408;
            padding: 20px 40px;
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent-cyan);
            text-decoration: none;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .menu-btn {
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            padding: 5px 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        /* PANEL DESPLEGABLE PROFESIONAL */
        .dropdown {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: #090e18;
            border-left: 2px solid var(--accent-cyan);
            display: flex;
            flex-direction: column;
            padding: 80px 25px 30px;
            transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 1001;
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.9);
        }

        .dropdown.active {
            right: 0;
        }

        .dropdown a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .dropdown a:hover {
            color: var(--accent-cyan);
            padding-left: 8px;
        }

        .close-menu {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* SECCIÓN HERO / INICIO */
        .hero {
            max-width: 900px;
            margin: 60px auto 40px;
            padding: 0 20px;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(157, 78, 221, 0.15);
            color: #d8b4fe;
            border: 1px solid var(--accent-purple);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
